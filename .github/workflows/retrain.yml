name: Monthly price-model retrain

on:
  schedule:
    - cron: "0 6 6 * *"          # 06:00 UTC on the 6th, after WFP's monthly update
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate and backtest only: no champion.json, no branch, no PR"
        type: boolean
        default: false

permissions:
  contents: write                # push the auto/retrain-* branch
  pull-requests: write           # open the PR

concurrency:
  group: monthly-retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      # Exit code is captured, not treated as a step failure, so the artifact upload and the
      # PR logic below can branch on it. 0 = updated, 1 = nothing new, 2 = validation failed, 3 = error.
      - name: Retrain (download, validate, backtest)
        id: retrain
        env:
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
        run: |
          set -u
          ARGS=(--out out --window-months 60 --previous-champion price_api/artifacts/champion.json)
          if [ -f data/wfp_snapshot.csv.gz ]; then
            ARGS+=(--previous-snapshot data/wfp_snapshot.csv.gz)
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          set +e
          python -I pipeline/retrain.py "${ARGS[@]}"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "::notice::retrain exit code $code"

      - name: Upload outputs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-out-${{ github.run_id }}
          path: out/
          retention-days: 90
          if-no-files-found: warn

      - name: Apply accepted outputs (exit 0 only)
        if: steps.retrain.outputs.code == '0' && inputs.dry_run != true
        run: |
          set -euo pipefail
          cp out/champion.json price_api/artifacts/champion.json
          if [ -f out/champion.previous.json ]; then
            cp out/champion.previous.json price_api/artifacts/champion.previous.json
          fi
          if [ -f out/latest_prices.json ]; then cp out/latest_prices.json price_api/artifacts/latest_prices.json; fi
          mkdir -p data
          cp out/wfp_snapshot.csv.gz data/wfp_snapshot.csv.gz
          # out/candidate/ (RF challenger model, when it wins) is NOT copied into the repo.
          # It stays in the workflow artifact for a human to review and promote by hand.

      - name: Open pull request (exit 0 only, never pushes to main)
        if: steps.retrain.outputs.code == '0' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MONTH=$(python -c "import json; print(json.load(open('out/champion.json'))['data_through'])")
          BRANCH="auto/retrain-${MONTH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A -- price_api/artifacts data
          if git diff --cached --quiet; then
            echo "No repo changes after apply; nothing to propose."
            exit 0
          fi
          git commit -m "Monthly retrain: data through ${MONTH}"
          # auto/ branches are bot-owned; a re-run for the same month replaces the branch.
          git push --force origin "HEAD:refs/heads/${BRANCH}"
          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            echo "PR for ${BRANCH} already exists; branch updated."
          else
            gh pr create --base main --head "$BRANCH" \
              --title "Monthly retrain: data through ${MONTH}" \
              --body-file out/report.md
          fi

      - name: Fail visibly on validation failure or unexpected error
        if: steps.retrain.outputs.code == '2' || steps.retrain.outputs.code == '3'
        run: |
          echo "::error::retrain exited with code ${{ steps.retrain.outputs.code }} (2 = validation failed, 3 = error). champion.json was not touched. See the retrain-out artifact report.md."
          exit 1
